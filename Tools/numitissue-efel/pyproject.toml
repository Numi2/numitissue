[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "numitissue-efel"
version = "1.0.0"
description = "Version-pinned eFEL feature extraction sidecar for NumiTissue"
requires-python = ">=3.10,<3.15"
dependencies = [
  "efel==5.7.34",
]

[project.scripts]
numitissue-efel = "numitissue_efel:main"

[tool.setuptools]
py-modules = ["numitissue_efel"]
