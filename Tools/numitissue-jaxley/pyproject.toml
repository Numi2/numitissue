[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "numitissue-jaxley"
version = "1.0.0"
description = "Version-pinned differentiable neuron fitting sidecar for NumiTissue"
requires-python = ">=3.12,<3.15"
dependencies = [
  "jaxley==0.13.0",
  "jax==0.11.1",
  "jaxlib==0.11.1",
]

[project.scripts]
numitissue-jaxley = "numitissue_jaxley:main"

[tool.setuptools]
py-modules = ["numitissue_jaxley"]
